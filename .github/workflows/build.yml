name: Build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  schedule:
    # Weekly check that Timber still compiles against the latest Paper builds
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: ./gradlew build

      - uses: actions/upload-artifact@v7
        with:
          name: Timber
          path: build/libs/*.jar

      - name: Attach JAR to release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" build/libs/*.jar --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  compatibility:
    name: Compile against Paper ${{ matrix.paper }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        paper: ["26.2", "26.3"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Compile
        run: ./gradlew compileJava "-PpaperApi=${{ matrix.paper }}.build.+"
