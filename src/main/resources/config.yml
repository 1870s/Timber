# Timber – configuration
# After making changes, run: /timber reload

# Only fell the whole tree while sneaking (Shift).
# Set to false = every log you break fells the whole tree.
require-sneak: true

# Only trigger with an axe in the main hand.
require-axe: true

# Also break the tree's leaves right away (saplings, sticks and apples drop as usual).
break-leaves: true

# Only trigger if natural (not player-placed) leaves are attached to the logs.
# Protects log cabins and other log builds from being torn down completely.
require-natural-leaves: true

# Stop before the axe breaks (1 durability is left).
protect-tool: true

# Limits per tree (prevents lag on huge trees).
max-logs: 256
max-leaves: 1024

# How far (in blocks) leaves may be from a log.
# Vanilla leaves are kept alive by a log at most 6 blocks away.
leaf-radius: 6

# Worlds where Timber is disabled, e.g. [world_nether, spawn]
disabled-worlds: []
