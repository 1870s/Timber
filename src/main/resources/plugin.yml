name: Timber
version: '${version}'
main: de.timber.TimberPlugin
api-version: '26.1'
description: Chop down entire trees at once by sneaking while breaking a log.
author: 1870s
website: https://github.com/1870s/Timber

permissions:
  timber.use:
    description: Allows chopping down whole trees
    default: true
  timber.reload:
    description: Allows /timber reload
    default: op
